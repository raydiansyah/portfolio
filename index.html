<!doctype html>
<html class="dark" lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/rydsh.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#11161d" />
  <title>Ray Diansyah — Explore the Harbor</title>

  <meta name="description"
    content="Ray Diansyah — web developer and IT trainer. Sail a small boat through a quiet wetland to explore projects, experience and services." />
  <meta name="keywords" content="web developer, IT trainer, portfolio, React, TypeScript, Three.js, Surabaya" />
  <meta name="author" content="Ray Diansyah" />

  <!-- The boat model is needed as soon as the engine boots; start fetching early (public pages only). -->
  <script>
    if (!/^\/secure(\/|$)/.test(location.pathname)) {
      var l = document.createElement('link');
      l.rel = 'preload'; l.as = 'fetch'; l.type = 'model/gltf-binary'; l.crossOrigin = ''; l.href = '/models/boat.glb';
      document.head.appendChild(l);
    }
  </script>

  <!-- Apply the stored theme before first paint to avoid a light/dark flash. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) { /* storage unavailable: keep default */ }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
